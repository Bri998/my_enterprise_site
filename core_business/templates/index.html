<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; max-width: 500px; width: 100%; }
        h1 { color: #1e3a8a; margin-bottom: 10px; font-size: 2.5rem; }
        p { color: #6b7280; font-size: 1.1rem; line-height: 1.6; }
        .badge { background-color: #d1fae5; color: #065f46; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">SYSTEM ONLINE</div>
        <h1>Enterprise Platform</h1>
        <p>Welcome to the core dashboard. Security management, logistics monitoring, and supply chain tracking modules are initialization-ready.</p>
    </div>
</body>
</html>
